<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Rio Grande Valley service area map</title>
  <desc id="desc">Stylized map showing RGV Concrete Stain service coverage across McAllen, Edinburg, Mission, Pharr, Weslaco, Harlingen, and Brownsville.</desc>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#161616" flood-opacity="1"/>
    </filter>
  </defs>

  <rect width="1400" height="720" fill="#f6f1e8"/>
  <rect width="1400" height="720" fill="url(#grid)"/>

  <path
    d="M176 340c88-66 154-90 242-96 78-5 136 16 220 8 92-8 142-50 232-40 81 9 132 58 205 75 74 17 151-2 222 35-52 57-123 96-210 116-86 21-171 17-258 33-105 19-178 70-278 63-90-6-144-56-229-72-60-11-112-2-171-25 4-35 12-67 25-97z"
    fill="#d8e0db"
    stroke="#161616"
    stroke-width="6"
  />
  <path
    d="M155 419c107 29 193 19 280 37 85 18 141 68 235 68 106 0 175-58 285-77 88-16 173-5 258-32 49-16 92-39 127-70"
    fill="none"
    stroke="#d96b1d"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.82"
  />
  <path
    d="M208 392c98 3 174 19 251 42 85 25 143 50 232 45 79-4 136-34 209-54 104-29 215-17 306-67"
    fill="none"
    stroke="#161616"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="18 16"
    opacity="0.55"
  />

  <g filter="url(#shadow)">
    <rect x="1000" y="88" width="316" height="112" fill="#d96b1d" stroke="#161616" stroke-width="6"/>
    <text x="1158" y="132" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="1.2">RGV CONCRETE STAIN</text>
    <text x="1158" y="169" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="39" font-weight="800" fill="#ffffff">Pharr, TX</text>
  </g>

  <g font-family="Barlow, Arial, sans-serif" font-size="29" font-weight="800" fill="#161616">
    <g>
