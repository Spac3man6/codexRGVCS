      <rect x="1115" y="496" width="164" height="48" fill="#fffdf8" stroke="#161616" stroke-width="4"/>
      <text x="1197" y="529" text-anchor="middle">Brownsville</text>
      <path d="M1189 452l6 44" fill="none" stroke="#161616" stroke-width="4"/>
    </g>
  </g>

  <g font-family="Barlow, Arial, sans-serif" fill="#161616">
    <text x="86" y="95" font-size="48" font-weight="800">Rio Grande Valley Service Radius</text>
    <text x="88" y="136" font-size="25" font-weight="700">Local decorative concrete scheduling across the main Valley cities.</text>
    <text x="700" y="666" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="0.8">Others cities upon request &amp; project approval.</text>
  </g>
