      <rect x="829" y="498" width="126" height="48" fill="#fffdf8" stroke="#161616" stroke-width="4"/>
      <text x="892" y="531" text-anchor="middle">Weslaco</text>
      <path d="M891 435l0 63" fill="none" stroke="#161616" stroke-width="4"/>
    </g>
    <g>
