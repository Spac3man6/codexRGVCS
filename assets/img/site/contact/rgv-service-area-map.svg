      <rect x="400" y="434" width="143" height="48" fill="#fffdf8" stroke="#161616" stroke-width="4"/>
      <text x="472" y="467" text-anchor="middle">McAllen</text>
      <path d="M501 397l-22 37" fill="none" stroke="#161616" stroke-width="4"/>
    </g>
    <g>
